<div id="loginModal" class="modal">
  <div class="panel modal-box">
    <button onclick="closeLogin()">×</button>
    <h2>ورود به رهام AI</h2>

    <input id="loginName" placeholder="نام و نام خانوادگی">
    <input id="loginEmail" type="email" placeholder="ایمیل">
    <input id="loginPassword" type="password" placeholder="رمز عبور">
    <input id="loginPhone" type="tel" placeholder="شماره موبایل">

    <button onclick="loginUser()">ورود / ثبت‌نام</button>
    <p id="loginMessage"></p>
  </div>
</div>

<script>
function loginUser() {
  const name = document.getElementById("loginName").value.trim();
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const phone = document.getElementById("loginPhone").value.trim();

  if (!name || !email || !password || !phone) {
    document.getElementById("loginMessage").textContent =
      "همه فیلدها را کامل کنید.";
    return;
  }

  if (email === "roham@rohamai.ir" && password === "roham123") {
    currentUser = {
      name: "رهام",
      email,
      phone,
      role: "admin",
      plan: "نامحدود"
    };
  } else {
    currentUser = {
      name,
      email,
      phone,
      role: "user",
      plan: "رایگان"
    };

    const users = JSON.parse(
      localStorage.getItem("roham_users") || "[]"
    );

    users.push(currentUser);
    localStorage.setItem("roham_users", JSON.stringify(users));
  }

  document.getElementById("status").textContent = currentUser.name;
  document.getElementById("logoutBtn").style.display = "block";
  closeLogin();
}
</script>
